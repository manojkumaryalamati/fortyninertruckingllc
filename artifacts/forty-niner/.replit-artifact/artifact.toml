kind = "web"
previewPath = "/"
title = "Forty Niner Trucking"
version = "1.0.0"
id = "artifacts/forty-niner"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20632

[services.development]
run = "pnpm --filter @workspace/forty-niner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/forty-niner", "run", "build" ]
publicDir = "artifacts/forty-niner/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20632"
BASE_PATH = "/"
