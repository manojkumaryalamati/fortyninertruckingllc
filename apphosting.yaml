env:
  - variable: BASE_PATH
    value: "/"
    availability:
      - BUILD
      - RUNTIME

scripts:
  buildCommand: pnpm --filter @workspace/forty-niner run build
  runCommand: node server.mjs

outputFiles:
  serverApp:
    include:
      - artifacts/forty-niner/dist
      - server.mjs
      - package.json
